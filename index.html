<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zeal Motor · Communications internes</title>
<style>
:root{--ink:#17191D;--muted:#4F545B;--line:#E3E0D9;--bg:#F4F3EF;--red:#ED1C24;--dark:#1F2023}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 56px}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
header img{height:40px}
h1{font-size:28px;line-height:1.2;margin:18px 0 6px}
h2{font-size:19px;margin:0 0 8px;display:flex;gap:10px;align-items:center}
.lead{color:var(--muted);margin:0 0 22px}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;margin-bottom:14px}
.num{flex:none;width:28px;height:28px;border-radius:14px;background:var(--dark);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.step p,.step li{color:var(--muted)}
.step ol{padding-left:20px;margin:6px 0}
.scripts{display:grid;gap:12px;margin-top:10px}
.script{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.script b{display:block;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,a.btn{display:inline-block;min-height:44px;padding:0 16px;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;line-height:44px;border:1px solid #C9C6BE;background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
button.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.ok{color:#17663F;font-weight:600;min-height:22px;margin-top:6px}
.warn{background:#FCEFD6;color:#5C3600;border-radius:12px;padding:12px 14px;margin-top:10px}
code{background:#ECEAE4;border-radius:6px;padding:1px 6px}
footer{color:var(--muted);font-size:13px;margin-top:28px}
</style>
</head>
<body>
<main>
  <header><img src="brand/zeal-logo.png" alt="Zeal Motor"></header>
  <h1>Communications internes</h1>
  <p class="lead">Ce site diffuse les widgets Zeal Motor. Son contenu est chiffré et réservé aux appareils activés.</p>
  <a class="btn" href="install/">Installer les widgets</a>
</main>
</body>
</html>
